<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask VoteCheck · VoteCheck NG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23008751'/%3E%3Crect x='14' width='12' height='40' fill='%23fff'/%3E%3Cpath d='M11 21l6 6 12-13' fill='none' stroke='%230b3b26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-title="nav.ask">
<header id="site-header"></header>
<main>
  <div class="page-head"><div class="inner">
    <span class="icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
    <div><h1 data-i18n="nav.ask"></h1><p data-i18n="ask.lead"></p></div>
  </div></div>

  <div class="wrap">
    <div class="card stack">
      <h2 class="sr-only" data-i18n="ask.suggested"></h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card stack">
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer">
        <label for="q" class="sr-only" data-i18n="ask.your"></label>
        <textarea id="q" rows="2" data-i18n-ph="ask.ph"></textarea>
        <button class="btn" id="send" type="submit" data-i18n="ask.send"></button>
      </form>
      <p class="small" id="mode"></p>
      <p class="notice" data-i18n="ask.confirm"></p>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/ask.js"></script>
</body>
</html>
