<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find my polling unit · VoteCheck NG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23008751'/%3E%3Crect x='14' width='12' height='40' fill='%23fff'/%3E%3Cpath d='M11 21l6 6 12-13' fill='none' stroke='%230b3b26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-title="nav.polling">
<header id="site-header"></header>
<main>
  <div class="page-head"><div class="inner">
    <span class="icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
    <div><h1 data-i18n="nav.polling"></h1><p data-i18n="polling.lead"></p></div>
  </div></div>

  <div class="wrap">
    <div class="card stack">
      <div class="row" style="justify-content:space-between"><h2 data-i18n="demo.title"></h2><span class="sev warning" data-i18n="demo.badge"></span></div>
      <p data-i18n="demo.lead"></p>
      <form class="vin-form" id="vin-form" novalidate>
        <label for="vin" data-i18n="demo.label"></label>
        <div class="row">
          <input type="text" id="vin" name="vin" autocomplete="off" spellcheck="false" maxlength="19" inputmode="text" style="max-width:320px;font-family:var(--mono);text-transform:uppercase">
          <button class="btn" type="submit" data-i18n="demo.go"></button>
        </div>
      </form>
      <div id="vin-result" role="status" aria-live="polite"></div>
      <div class="small"><span data-i18n="demo.try"></span> <span id="vin-samples"></span></div>
    </div>

    <div class="card stack">
      <h2 data-i18n="polling.steps"></h2>
      <ol class="steps">
        <li><div><strong data-i18n="step1.t"></strong><span data-i18n="step1.d"></span></div></li>
        <li><div><strong data-i18n="step2.t"></strong><span data-i18n="step2.d"></span></div></li>
        <li><div><strong data-i18n="step3.t"></strong><span data-i18n="step3.d"></span></div></li>
        <li><div><strong data-i18n="step4.t"></strong><span data-i18n="step4.d"></span></div></li>
      </ol>
      <div class="row">
        <a class="btn" href="https://inecnigeria.org" target="_blank" rel="noopener" data-i18n="polling.open"></a>
        <a class="btn ghost" href="/ask?topic=where-to-vote" data-i18n="nav.ask"></a>
      </div>
    </div>

    <div class="card stack">
      <h3 data-i18n="polling.whyT"></h3>
      <p data-i18n="polling.why"></p>
      <p class="notice" data-i18n="polling.warn"></p>
    </div>

    <div class="card stack">
      <h3 id="answer-h" data-i18n="polling.inLang"></h3>
      <p id="answer" class="answer"></p>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/polling.js"></script>
</body>
</html>
