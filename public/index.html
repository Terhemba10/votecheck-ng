<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteCheck NG</title>
<meta name="description" content="Independent, nonpartisan election help for Nigerian voters and observers, in five languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23008751'/%3E%3Crect x='14' width='12' height='40' fill='%23fff'/%3E%3Cpath d='M11 21l6 6 12-13' fill='none' stroke='%230b3b26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-title="home">
<header id="site-header"></header>

<main>
  <section class="hero" id="hero" aria-roledescription="carousel" data-i18n-aria="hero.label">
    <div class="hero-flag" aria-hidden="true"><canvas></canvas></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="inner hero-inner">
      <h1 class="sr-only" data-i18n="home.sr"></h1>
      <div class="hero-bars" role="group" data-i18n-aria="hero.choose"></div>
      <div class="slides">
        <article class="slide" role="group" aria-roledescription="slide" aria-label="1 of 3">
          <div>
            <h2 class="slide-title" data-i18n="s1.title"></h2>
            <p class="slide-text" data-i18n="s1.text"></p>
            <a class="btn hero-cta" href="/ask" data-i18n="s1.cta"></a>
          </div>
          <div class="scene-slot" data-scene="voters"></div>
        </article>
        <article class="slide from-left" role="group" aria-roledescription="slide" aria-label="2 of 3">
          <div>
            <h2 class="slide-title" data-i18n="s2.title"></h2>
            <p class="slide-text" data-i18n="s2.text"></p>
            <a class="btn hero-cta" href="/faq#how-voting-works" data-i18n="s2.cta"></a>
          </div>
          <div class="scene-slot" data-scene="ballot"></div>
        </article>
        <article class="slide" role="group" aria-roledescription="slide" aria-label="3 of 3">
          <div>
            <h2 class="slide-title" data-i18n="s3.title"></h2>
            <p class="slide-text" data-i18n="s3.text"></p>
            <a class="btn hero-cta" href="/ask?topic=vote-buying" data-i18n="s3.cta"></a>
          </div>
          <div class="scene-slot" data-scene="refuse"></div>
        </article>
      </div>
      <button class="hero-pause" type="button" aria-pressed="false"><span aria-hidden="true" class="icon"></span><span class="label" data-i18n="pause"></span></button>
    </div>
  </section>

  <section class="home-section" aria-labelledby="tools-h">
    <h2 id="tools-h" data-i18n="tools.title"></h2>
    <p data-i18n="tools.sub"></p>
    <div class="tools">
      <a class="tool" href="/polling-unit">
        <span class="icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
        <span><h3 data-i18n="nav.polling"></h3><p data-i18n="tool.polling"></p><span class="go" data-i18n="nav.polling"></span></span>
      </a>
      <a class="tool" href="/results">
        <span class="icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <span><h3 data-i18n="nav.results"></h3><p data-i18n="tool.results"></p><span class="go" data-i18n="nav.results"></span></span>
      </a>
      <a class="tool" href="/ask">
        <span class="icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
        <span><h3 data-i18n="nav.ask"></h3><p data-i18n="tool.ask"></p><span class="go" data-i18n="s1.cta"></span></span>
      </a>
      <a class="tool" href="/result-sheet">
        <span class="icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8.5 15l2.5 2.5 4.5-5"/></svg></span>
        <span><h3 data-i18n="nav.sheet"></h3><p data-i18n="tool.sheet"></p><span class="go" data-i18n="nav.sheet"></span></span>
      </a>
    </div>
  </section>

  <section class="home-section" aria-labelledby="faq-h">
    <h2 id="faq-h" data-i18n="home.faq"></h2>
    <p data-i18n="home.faqSub"></p>
    <div class="faq-teaser" id="faq-teaser"></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script type="module" src="/home.js"></script>
</body>
</html>
